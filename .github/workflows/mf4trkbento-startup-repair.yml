name: MF4TRKBento v1.6 startup repair
on:
  push:
    branches:
      - repair/mf4trkbento-v1.6-startup-guard-20261115
permissions:
  contents: read
jobs:
  regression-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        run: |
          python -m compileall -q MF4TRKBento_REVIEW/startup-repair-v1.6/MF4TRKBento
          python -m compileall -q MF4TRKBento_REVIEW/startup-repair-v1.6/tests
      - name: Run smoke, feature matrix and startup lifecycle tests
        working-directory: MF4TRKBento_REVIEW/startup-repair-v1.6/tests
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Build experimental ZIP and print SHA-256
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          package = Path("MF4TRKBento_REVIEW/startup-repair-v1.6/MF4TRKBento")
          output = Path("dist/MF4TRKBento_v1.6_STARTUP_REPAIR_EXP.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(package.parent))
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          print(f"ZIP={output}")
          print(f"SHA256={digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MF4TRKBento-v1.6-startup-repair-EXP
          path: dist/MF4TRKBento_v1.6_STARTUP_REPAIR_EXP.zip
          if-no-files-found: error
          retention-days: 30
